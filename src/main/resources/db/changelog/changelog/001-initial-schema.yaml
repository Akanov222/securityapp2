databaseChangeLog:
  - changeSet:
      id: 1
      author: your_name
#      validCheckSum: ANY
      changes:
        - createTable:
            tableName: person
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: password
                  type: VARCHAR
                  constraints:
                    nullable: false